name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install tooling
        run: python -m pip install --upgrade pip "ruff==0.17.2" "pytest==9.1.1"
      - name: Lint
        run: ruff check src tests tools scripts game
      - name: Unit tests (pure core)
        run: python -m pytest -q
      - name: Compile all python (syntax gate for UPBGE/Blender scripts)
        run: python -m compileall -q src tools scripts game
      - name: Validate backlog JSON
        run: python -c "import json;json.load(open('backlog/backlog.json'));json.load(open('opencode.json'));print('json ok')"
      - name: Block committed secrets (basic)
        run: |
          if git grep -nEI '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' -- . ':!docs' ; then
            echo "Possible secret committed"; exit 1; fi
      - name: Block oversized non-LFS files (>5MB)
        run: |
          find . -path ./.git -prune -o -type f -size +5M -print | while read f; do
            git check-attr filter -- "$f" | grep -q lfs || { echo "Not in LFS: $f"; exit 1; }
          done
